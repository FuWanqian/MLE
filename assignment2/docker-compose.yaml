services:
  jupyter:
    build: 
      context: .
      dockerfile: Dockerfile_jupyter.txt
    image: mle-project-jupyter
    container_name: mle_project_jupyter_container
    ports:
      - "8888:8888"
    volumes:
      # Mount the current directory (project root) to /app in container
      - .:/app
      # Mount git config for seamless git operations
      - ~/.gitconfig:/root/.gitconfig:ro
      # Mount SSH keys for private repo access (optional)
      - ~/.ssh:/root/.ssh:ro
      # Ensure git credentials are available
      - ~/.git-credentials:/root/.git-credentials:ro
      - ./datamart:/opt/airflow/datamart

    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--notebook-dir=/app", "--ServerApp.token=''", "--ServerApp.disable_check_xsrf=True"]

    #Airflow Service
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile_airflow.txt
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - .:/opt/airflow
      - ./airflow_jobs:/opt/airflow/dags


    entrypoint: >
      /bin/bash -c "airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile_airflow.txt
    container_name: airflow_webserver
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__AUTH_BACKEND=airflow.auth.backends.allow_all
      - AIRFLOW__WEBSERVER__AUTHENTICATE=False
      - AIRFLOW__WEBSERVER__RBAC=False
      
    volumes:
      - .:/opt/airflow
      - ./airflow_jobs:/opt/airflow/dags

    ports:
      - "8091:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile_airflow.txt
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - .:/opt/airflow
      - ./airflow_jobs:/opt/airflow/dags
      

    command: scheduler

volumes:
  airflow_data:
